// Build file for the CrystalPlugin AAR.
// Built in CI (.github/workflows/build-apk.yml): Gradle 8.10.2, AGP 8.5.2,
// compileSdk 34, compileOnly org.godotengine:godot:4.4.1.stable.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.crystalnova.launcher.plugin'
    compileSdk 34

    defaultConfig {
        minSdk 24
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Provided by the Godot Android export: org.godotengine:godot:4.4.1.stable
    compileOnly 'org.godotengine:godot:4.4.1.stable'
}
