// Build skeleton for the CrystalPlugin AAR.
// PENDING: requires the Android SDK + Godot's godot-lib to compile.
// This file documents the intended build; it has not been run.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.crystalnova.launcher.plugin'
    compileSdk 34

    defaultConfig {
        minSdk 24
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Provided by the Godot Android export: org.godotengine:godot:4.4.1.stable
    compileOnly 'org.godotengine:godot:4.4.1.stable'
}
