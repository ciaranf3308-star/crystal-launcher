# Crystal Launcher — CI build: commit -> APK artifact. No local build host required.
#
# Pinned toolchain (do NOT float these without a reason):
#   Java 17 (Temurin) | Android cmdline-tools 11076708 | platform android-34,
#   build-tools 34.0.0 | Gradle 8.10.2 | Godot 4.4.1-stable + 4.4.1 export templates
#   AGP 8.5.2 + Kotlin 1.9.24 are pinned in android/plugins/CrystalPlugin/settings.gradle.
#
# Pipeline: build CrystalPlugin AAR -> drop it next to the .gdap ->
# install Android build template -> headless Godot export (GRADLE build:
# required — Godot 4.4's prebuilt-APK path ignores .gdap plugins) ->
# signed (debug-key) APK artifact.

name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      GODOT_VERSION: 4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK (pinned cmdline-tools)
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          rm cmdtools.zip
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Gradle 8.10.2
        run: |
          set -eux
          curl -sSL -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.10.2/bin" >> "$GITHUB_PATH"
          gradle --version | head -8

      - name: Build CrystalPlugin AAR
        run: |
          set -eux
          cd android/plugins/CrystalPlugin
          gradle assembleRelease --no-daemon --console=plain
          ls -la build/outputs/aar/
          # The .gdap (android/plugins/CrystalPlugin.gdap) resolves
          # binary="CrystalPlugin.aar" relative to its own directory.
          cp build/outputs/aar/CrystalPlugin-release.aar ../CrystalPlugin.aar
          ls -la ../CrystalPlugin.aar

      - name: Install Godot 4.4.1 headless editor
        run: |
          set -eux
          mkdir -p "$HOME/godot"
          cd "$HOME/godot"
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Install Godot 4.4.1 export templates
        run: |
          set -eux
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          cd /tmp
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d "$TPL"
          # Flatten if the archive nests everything one level down.
          if [ ! -f "$TPL/android_release.apk" ]; then
            SUB=$(find "$TPL" -maxdepth 2 -name android_release.apk | head -1 | xargs dirname)
            if [ -n "$SUB" ] && [ "$SUB" != "$TPL" ]; then
              mv "$SUB"/* "$TPL"/
            fi
          fi
          ls "$TPL" | head -20
          test -f "$TPL/android_release.apk"

      - name: Restore persistent beta signing key
        env:
          LAUNCHER_KEYSTORE_B64: ${{ secrets.LAUNCHER_KEYSTORE_B64 }}
        run: |
          set -eux
          # Matches keystore/release* in export_presets.cfg. One persistent
          # beta key (stored as a repo secret) so every CI build installs
          # cleanly over the previous one. Debug-grade key: beta/test
          # builds only, never a store release.
          test -n "$LAUNCHER_KEYSTORE_B64"
          echo "$LAUNCHER_KEYSTORE_B64" | base64 -d > /home/runner/debug.keystore
          keytool -list -keystore /home/runner/debug.keystore \
            -storepass android -alias androiddebugkey | head -5

      - name: Export Android APK (headless)
        run: |
          set -eux
          mkdir -p build
          # --install-android-build-template unpacks android_source.zip into
          # android/build/ so the gradle path (required for plugin AARs) works.
          "Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path . \
            --install-android-build-template \
            --export-release "Android" build/crystal-launcher.apk
          ls -la build/crystal-launcher.apk

      - name: Verify CrystalPlugin registered in APK
        run: |
          set -eux
          # Beta1–beta3 shipped a silent failure: the plugin's classes were
          # merged into the dex but the engine never registered the
          # singleton, because the AAR manifest lacked the
          # org.godotengine.plugin.v1.* meta-data Godot scans for at
          # startup. Assert on the merged manifest's string pool (binary
          # XML: UTF-8 or UTF-16), not on the dex.
          python3 - <<'EOF'
          import sys, zipfile
          with zipfile.ZipFile("build/crystal-launcher.apk") as z:
              manifest = z.read("AndroidManifest.xml")
          needle = b"org.godotengine.plugin.v1.CrystalPlugin"
          ok = needle in manifest or needle.decode().encode("utf-16-le") in manifest
          print("plugin meta-data present:", ok)
          sys.exit(0 if ok else 1)
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-launcher-apk
          path: build/crystal-launcher.apk
          retention-days: 30
          if-no-files-found: error
