[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/crystal-launcher.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; Gradle build REQUIRED for .gdap plugin AARs: Godot 4.4's prebuilt-APK path
; silently ignores android/plugins/*.gdap (see export_plugin.cpp get_plugins /
; get_enabled_plugins — only the gradle path merges plugin binaries).
gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=5
version/name="0.3.0-beta3"
version/min_sdk=24
version/target_sdk=34
package/unique_name="io.crystalnova.launcher"
package/name="Crystal Launcher"
package/signed=true
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_fire_tv=false
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
launcher_icons/adaptive_monochrome_432x432=""
graphics/opengl_debug=false
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/internet=false
; Android plugins are opt-in per preset: Godot only discovers .gdap files
; directly under android/plugins/ (not in subdirectories) and only merges the
; AAR when the plugin is enabled here.
plugins/CrystalPlugin=true
; Release keystore = CI-generated debug key (see .github/workflows/build-apk.yml).
; This is a beta/test build, never a store release. Path must be absolute.
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release="/home/runner/debug.keystore"
keystore/release_user="androiddebugkey"
keystore/release_password="android"
